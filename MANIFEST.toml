uuid = "63c024d9-183b-4dbb-b31e-b6b4db7af439"
name = "Remove Matched Albums"
authors = ["Bob Swift"]
description = "This plugin allows the user to remove completely matched and saved albums from the album pane."
api = ['3.0']
license = "GPL-2.0-or-later"
license_url = "https://www.gnu.org/licenses/gpl-2.0.html"
long_description = "This plugin allows the user to remove completely matched and saved albums from the album pane. It provides an action under the \"Plugin Tools\" section of Picard's manu menu.\n\nThe plugin is based on the Picard v2 \"Remove Perfect Albums\" plugin by ichneumon and hrglgrmpf, and has been converted for use with Picard v3 by Bob Swift."
categories = ["ui", "other"]
homepage = "https://picard-plugins-user-guides.readthedocs.io/en/latest/remove_matched_albums/user_guide.html"
report_bugs_to = "https://github.com/rdswift/picard-plugin-remove-matched-albums/issues"

[name_i18n]
fr = "Supprimer les albums correspondants"

[description_i18n]
fr = "Ce plugin permet à l'utilisateur de supprimer du volet des albums les albums dont la correspondance est parfaite et qui ont été enregistrés."

[long_description_i18n]
fr = "Ce plugin permet à l'utilisateur de supprimer du volet « Albums » les albums dont la correspondance est parfaite et qui ont été enregistrés. Il propose une action dans la section « Outils du plugin » du menu principal de Picard.\n\nCe plugin s'inspire du plugin « Remove Perfect Albums » pour Picard v2, créé par ichneumon et hrglgrmpf, et a été adapté pour Picard v3 par Bob Swift."
